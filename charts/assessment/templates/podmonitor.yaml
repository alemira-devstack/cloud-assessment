apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: producer
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: producer
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: worker
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
