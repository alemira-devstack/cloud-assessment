apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: {{ .Values.producer.replicas }}
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: {{ .Values.producer.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: {{ .Values.env.redisAddr | quote }}
            - name: QUEUE_NAME
              value: {{ .Values.env.queueName | quote }}
            - name: PRODUCE_RATE
              value: {{ .Values.env.produceRate | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  selector:
    app: producer
  ports:
    - port: 8080
      targetPort: 8080
