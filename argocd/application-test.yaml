apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: assessment-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alemira-devstack/cloud-assessment.git
    targetRevision: main
    path: charts/assessment
    helm:
      valueFiles:
        - values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: worker
      jsonPointers:
        - /spec/replicas
